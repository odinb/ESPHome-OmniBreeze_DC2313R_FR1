# Board: Generic - BK7238
# Definition: definitions/boards/generic-bk7238/manifest.yaml

substitutions:
  name: omnibreeze-fan-bk01
  friendly_name: Omnibreeze Fan BK01

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

bk72xx:
  board: generic-bk7238

# Enable logging
logger:
  level: WARN

api:
  encryption:
    key: !secret api_key_omnibreeze

# Enable over-the-air updates.
ota:
  - platform: esphome
    encryption:

# Connect to WiFi.
wifi:
  fast_connect: true
  networks:
    - ssid: !secret "wifi_ssid1"
      password: !secret "wifi_password1"
# Enable fallback hotspot in case wifi connection fails (takes up unnessecary RAM)
  ap:
    ssid: ${friendly_name}
    password: !secret wifi_hotspot_password

captive_portal:

# Enable Web server. Not recommended!
#web_server:
#  port: 80
#  auth:
#    username: !secret username_omnibreeze
#    password: !secret web_password_omnibreeze
#    type: digest

# ----------------------------
# Binary Sensors
# ----------------------------
uart:
  - baud_rate: 115200
    rx_pin: P10
    tx_pin: P11
    id: tuya_uart

tuya:
  uart_id: tuya_uart

fan:
  - platform: template
    name: OmniBreeze Fan
    id: omnibreeze_fan
    icon: "mdi:fan"
    speed_count: 5
    has_oscillating: true
    preset_modes:
      - "Normal" 
      - "Natural"
      - "Sleep"
      - "Auto"
    on_turn_on:
      then:
        - switch.turn_on: switch_power
    on_turn_off:
      - then:
          - switch.turn_off: switch_power
    on_speed_set:
      - then:
          - number.set:
              id: number_fan_speed
              value: !lambda return x;
    on_oscillating_set:
      - then:
          - if:
              condition:
                lambda: |
                  return x;
              then:
                - switch.turn_on: switch_oscillation
              else:
                - switch.turn_off: switch_oscillation
    on_preset_set:
      - then:
          - lambda: |
              int mode_val = 0;
              if (x == "Normal") mode_val = 0;
              else if (x == "Natural") mode_val = 1;
              else if (x == "Sleep") mode_val = 2;
              else if (x == "Auto") mode_val = 3;
              if ((int) id(number_mode).state != mode_val) {
                id(number_mode).make_call().set_value(mode_val).perform();
              }
switch:
  - platform: tuya
    name: Power
    switch_datapoint: 1
    id: switch_power
    icon: "mdi:toggle-switch-outline"
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_state:
      - then:
          - lambda: |
              id(omnibreeze_fan).state = x;
              id(omnibreeze_fan).publish_state();
    device_class: switch
  - platform: tuya
    name: Oscillation
    switch_datapoint: 5
    id: switch_oscillation
    icon: "mdi:toggle-switch-outline"
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_state:
      - then:
          - lambda: |
              id(omnibreeze_fan).oscillating = x;
              id(omnibreeze_fan).publish_state();
    device_class: switch
  - platform: tuya
    name: Beep
    switch_datapoint: 13
    id: switch_beep
    icon: "mdi:toggle-switch-outline"
    restore_mode: RESTORE_DEFAULT_ON
    device_class: switch
    entity_category: config
  - platform: tuya
    name: Display
    switch_datapoint: 15
    id: switch_display
    icon: "mdi:toggle-switch-outline"
    restore_mode: RESTORE_DEFAULT_ON
    device_class: switch
    entity_category: config

number:
  - platform: tuya
    name: Fan Speed
    max_value: 5
    min_value: 1
    number_datapoint: 3
    step: 1
    id: number_fan_speed
    icon: "mdi:fan-speed3"
    on_value:
      - then:
          - lambda: |
              id(omnibreeze_fan).speed = (int) x;
              id(omnibreeze_fan).publish_state();
    internal: true
  - platform: tuya
    name: Mode
    max_value: 3
    min_value: 0
    number_datapoint: 2
    step: 1
    id: number_mode
    icon: "mdi:fan-auto"    
    on_value:
      - then:
          - lambda: |
              static const char *modes[] = {"Normal", "Natural", "Sleep", "Auto"};
              int idx = (int) x;
              if (idx >= 0 && idx <= 3) {
                auto current = id(omnibreeze_fan).get_preset_mode();
                if (strcmp(current.c_str(), modes[idx]) != 0) {
                  id(omnibreeze_fan).make_call().set_preset_mode(modes[idx]).perform();
                }
              }
    internal: true
  - platform: tuya
    name: Timer
    max_value: 12
    min_value: 0
    number_datapoint: 22
    step: 1
    id: number_timer
    icon: "mdi:fan-clock"
    unit_of_measurement: h

sensor:
  - platform: tuya
    name: Temperature
    sensor_datapoint: 21
    id: sensor_temp
    icon: "mdi:thermometer"
    device_class: temperature
    unit_of_measurement: °F
    state_class: measurement
    filters:
      - offset: -1.40